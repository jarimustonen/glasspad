[package]
name = "glasspad"
version = "0.17.2"
edition = "2024"
description = "AI-friendly HTML/Markdown-artifact publisher: hand it markdown, get a URL — config-driven loopback or hosted, each page in a null-origin sandboxed iframe for dashboards, charts, and interactive UIs."
license = "MIT"
repository = "https://github.com/jarimustonen/glasspad"
homepage = "https://github.com/jarimustonen/glasspad"
readme = "README.md"
keywords = ["html", "artifact", "sandbox", "dashboard", "cli"]
categories = ["command-line-utilities", "web-programming", "visualization"]
exclude = ["issues/", "history/", ".worktree/", "test-*.sh", "*.png", "AGENTS*.md"]

# Keep one published package (`glasspad`) while giving its two Rust crates an
# explicit library-first physical boundary. This preserves `cargo publish` and
# `cargo install glasspad` as single-package operations.
[lib]
name = "glasspad"
path = "crates/glasspad-core/src/lib.rs"

[[bin]]
name = "glasspad"
path = "crates/glasspad-cli/src/main.rs"

[workspace]
members = ["."]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
csv = "1"
mail-parser = "0.9"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2"

# Unix-only: process liveness (`kill(pid, 0)`) and graceful stop (`kill(pid,
# SIGTERM)`) for the loopback-server pid file / `glasspad stop`. Already in the
# dependency tree transitively; declared directly so the pidfile module can use it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

# The profile that 'dist' (cargo-dist) will build with.
[profile.dist]
inherits = "release"
lto = "thin"
