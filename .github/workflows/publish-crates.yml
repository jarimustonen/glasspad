name: Publish to crates.io

# Publishes to crates.io in CI on a version tag push, with no dependency on a
# local token. Requires a CARGO_REGISTRY_TOKEN repo secret with publish scope
# (set once with `gh secret set CARGO_REGISTRY_TOKEN --repo <owner>/glasspad`).
#
# Triggered by the tag push itself — NOT `release: published` — because the
# GitHub Release is created by cargo-dist's release.yml using GITHUB_TOKEN, and
# releases created by GITHUB_TOKEN do not emit `release` workflow events. This
# runs in parallel with release.yml (crates publishing needs only the tagged
# source, not the built binaries). Re-publishing an existing version is a
# harmless no-op failure.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run cargo publish --dry-run instead of publishing"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify
        run: cargo build --release

      - name: Publish (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --dry-run

      - name: Publish
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run != 'true') }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
