name: Publish to crates.io

# Publishes to crates.io in CI on a version tag push, with no dependency on a
# local token. Requires a CARGO_REGISTRY_TOKEN repo secret with publish scope
# (set once with `gh secret set CARGO_REGISTRY_TOKEN --repo <owner>/glasspad`).
#
# Triggered by the tag push itself — NOT `release: published` — because the
# GitHub Release is created by cargo-dist's release.yml using GITHUB_TOKEN, and
# releases created by GITHUB_TOKEN do not emit `release` workflow events. This
# runs in parallel with release.yml (crates publishing needs only the tagged
# source, not the built binaries). Manual dispatch is dry-run-only; a real
# publish requires the version-tag trigger. Retry a transient failure from the
# original tag-push run with "Re-run failed jobs"; never delete and re-push the
# tag. A version already present on crates.io fails this job by design.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify
        run: cargo build --release

      - name: Publish (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: cargo publish --dry-run

      - name: Publish
        if: ${{ github.event_name == 'push' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
