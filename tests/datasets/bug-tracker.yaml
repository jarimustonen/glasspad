spec_version: 1
title: "Bug Tracker — Velox Platform"
description: "Fictional bug tracking data with status, priority, assignee, and resolution details"
layout: grid-2col

sections:
  - id: bug-board
    title: "Open Issues"
    type: list
    list:
      id_field: id
      layout: cards
      title_field: title
      subtitle_field: assignee
      meta_field: priority
      preview_field: description
      item_click: open_detail
      detail:
        fields:
          - { field: id, title: "ID" }
          - { field: priority, title: "Priority" }
          - { field: status, title: "Status" }
          - { field: assignee, title: "Assignee" }
          - { field: component, title: "Component" }
          - { field: reported_by, title: "Reported By" }
          - { field: created, title: "Created" }
          - { field: labels, title: "Labels" }
        body_field: description
        actions:
          - { id: assign, label: "Reassign", style: info }
          - { id: close, label: "Close", style: success }
    inline_data: &bug_data
      - { id: "BUG-301", title: "Dashboard charts flicker on resize", priority: "Medium", status: "Open", assignee: "Carol Wu", component: "Frontend", reported_by: "QA Bot", created: "2026-04-10", labels: "ui, charts", description: "When resizing the browser window, dashboard charts briefly flash white before re-rendering. Appears to be a Vega-Lite container sizing race condition. Reproducible on Chrome and Firefox." }
      - { id: "BUG-302", title: "API returns 500 on empty filter parameter", priority: "High", status: "In Progress", assignee: "Alice Chen", component: "API Gateway", reported_by: "Customer #4421", created: "2026-04-09", labels: "api, validation", description: "Sending GET /api/events?filter= (empty string) returns HTTP 500 instead of 400. The query parser tries to deserialize an empty string as JSON. Affects API v2 only — v1 handles this correctly." }
      - { id: "BUG-303", title: "Email notifications sent twice for same event", priority: "Critical", status: "In Progress", assignee: "David Park", component: "Notifications", reported_by: "Customer #3892", created: "2026-04-08", labels: "notifications, duplicate", description: "Users report receiving duplicate email notifications for the same alert trigger. Likely cause: SQS message visibility timeout too short, causing Lambda to process the same message twice before acknowledgment." }
      - { id: "BUG-304", title: "CSV export truncates Unicode characters", priority: "Medium", status: "Open", assignee: "Bob Martinez", component: "Reports", reported_by: "Customer #5102", created: "2026-04-08", labels: "export, encoding", description: "Exporting reports containing Japanese or Arabic text to CSV produces garbled characters. The export function uses ASCII encoding instead of UTF-8 BOM. Affects Excel on Windows specifically." }
      - { id: "BUG-305", title: "Memory leak in real-time WebSocket connection", priority: "Critical", status: "Open", assignee: "Alice Chen", component: "Analytics", reported_by: "Ops Team", created: "2026-04-07", labels: "backend, memory", description: "Analytics service memory grows ~50MB/hour under sustained WebSocket connections. Heap dump shows event listener objects not being GC'd after client disconnect. Affects prod cluster node-3 and node-4." }
      - { id: "BUG-306", title: "Dark mode: graph labels unreadable", priority: "Low", status: "Open", assignee: "Eve Johnson", component: "Frontend", reported_by: "Internal", created: "2026-04-07", labels: "ui, dark-mode", description: "In dark mode, chart axis labels and legends use dark gray text on dark background. Need to invert text colors when dark mode is active. Vega-Lite theme config needs updating." }
      - { id: "BUG-307", title: "Report scheduler skips DST transition", priority: "High", status: "In Review", assignee: "Bob Martinez", component: "Reports", reported_by: "Customer #2201", created: "2026-04-06", labels: "scheduler, timezone", description: "Weekly reports scheduled for Monday 9 AM EST were not generated during the spring DST transition (March 9). The cron evaluator uses wall clock time without DST awareness. Fix: switch to UTC internally." }
      - { id: "BUG-308", title: "Login page infinite redirect on Safari", priority: "High", status: "Resolved", assignee: "Carol Wu", component: "Auth", reported_by: "Customer #6740", created: "2026-04-05", labels: "auth, safari", description: "Safari users experience an infinite redirect loop on the login page. Root cause: SameSite=Strict cookie policy blocks the OAuth callback. Fix: changed to SameSite=Lax for the auth cookie. Deployed in v2.14.3." }
      - { id: "BUG-309", title: "Stale cache after workspace switch", priority: "Medium", status: "Resolved", assignee: "David Park", component: "Frontend", reported_by: "Internal", created: "2026-04-04", labels: "cache, state", description: "Switching between workspaces shows data from the previous workspace for ~5 seconds. React Query cache key doesn't include workspace_id. Fix: added workspace_id to all query keys. Deployed in v2.14.2." }
      - { id: "BUG-310", title: "Rate limiter counts OPTIONS as requests", priority: "Low", status: "Open", assignee: "Alice Chen", component: "API Gateway", reported_by: "Internal", created: "2026-04-03", labels: "api, cors", description: "CORS preflight OPTIONS requests count toward the rate limit quota. Frontend-heavy SPAs can exhaust their limit with preflight requests alone. Fix: exempt OPTIONS from rate counting." }

  - id: by-priority
    title: "Issues by Priority"
    type: chart
    interactive_filter:
      field: priority
    chart:
      mark: bar
      encoding:
        x: { field: priority, type: nominal }
        y: { aggregate: count, type: quantitative }
        color: { field: priority, type: nominal }
    inline_data: *bug_data

  - id: by-component
    title: "Issues by Component"
    type: chart
    chart:
      mark: bar
      encoding:
        x: { field: component, type: nominal }
        y: { aggregate: count, type: quantitative }
        color: { field: component, type: nominal }
    inline_data: *bug_data

  - id: bug-stats
    title: "Issue Statistics"
    type: stats
    stats:
      items:
        - { label: "Total issues", aggregate: count }
        - { label: "Components affected", aggregate: distinct, field: component }
        - { label: "Assignees", aggregate: distinct, field: assignee }
        - { label: "Critical", aggregate: count, where: { priority: "Critical" } }
        - { label: "Resolved", aggregate: count, where: { status: "Resolved" } }
    inline_data: *bug_data

  - title: "All Issues"
    type: table
    table:
      columns:
        - { field: id, title: "ID", sort: string, width: 80 }
        - { field: title, title: "Title", sort: string }
        - { field: priority, title: "Priority", sort: string }
        - { field: status, title: "Status", sort: string }
        - { field: assignee, title: "Assignee", sort: string }
        - { field: component, title: "Component", sort: string }
        - { field: created, title: "Created", sort: temporal }
    inline_data: *bug_data
