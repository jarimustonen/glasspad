  - title: "Release Notes"
    type: markdown
    markdown:
      content: |
        ## What's New in v2.4

        This release introduces **theme support** and several improvements:

        ### Dark Mode
        Glasspad now ships with a polished dark theme inspired by [Linear](https://linear.app)'s precision aesthetic. All components render beautifully in both light and dark variants.

        ### Highlights
        - CSS custom properties (`--gp-*`) for all theme tokens
        - Automatic `prefers-color-scheme` detection
        - Explicit `theme: light | dark | auto` in dashboard specs
        - Vega-Lite charts adapt axis/grid colors to the active theme

        ### Code Example

        ```yaml
        spec_version: 1
        title: "My Dashboard"
        theme: dark
        sections:
          - title: "Revenue"
            type: stats
            stats:
              items:
                - { label: "Total", aggregate: sum, field: amount }
        ```

        ### Migration Guide

        | Before | After |
        |--------|-------|
        | Hardcoded `#e5e7eb` borders | `var(--gp-border)` |
        | Hardcoded `#1a1a2e` text | `var(--gp-text)` |
        | Hardcoded `white` gradients | `var(--gp-surface)` |

        > **Note:** All existing dashboards work unchanged. The default `auto` theme follows your system preference.

        ---

        *Built with precision. Designed for data.*
