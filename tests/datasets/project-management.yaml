spec_version: 1
title: "Sprint Board — Project Velox"
description: "Fictional project management data — sprint tasks with status, assignees, and story points"
layout: grid-2col

sections:
  - id: task-board
    title: "Sprint 14 Task Board"
    type: list
    list:
      id_field: id
      layout: cards
      title_field: title
      subtitle_field: assignee
      meta_field: status
      preview_field: description
      item_click: open_detail
      detail:
        fields:
          - { field: assignee, title: "Assignee" }
          - { field: status, title: "Status" }
          - { field: priority, title: "Priority" }
          - { field: story_points, title: "Story Points" }
          - { field: sprint, title: "Sprint" }
          - { field: type, title: "Type" }
          - { field: tags, title: "Tags" }
        body_field: description
    inline_data: &pm_data
      - { id: "VLX-101", title: "Implement user authentication flow", assignee: "Alice Chen", status: "Done", priority: "High", story_points: 8, sprint: "Sprint 14", type: "Feature", tags: "auth, security", description: "Build OAuth2 login flow with Google and GitHub providers. Include token refresh, session management, and logout. Must support both web and mobile clients." }
      - { id: "VLX-102", title: "Design database schema for notifications", assignee: "Bob Martinez", status: "Done", priority: "Medium", story_points: 3, sprint: "Sprint 14", type: "Task", tags: "database, notifications", description: "Create PostgreSQL schema for push notifications. Include tables for notification templates, user preferences, and delivery log." }
      - { id: "VLX-103", title: "Fix pagination bug in search results", assignee: "Carol Wu", status: "In Progress", priority: "High", story_points: 2, sprint: "Sprint 14", type: "Bug", tags: "search, pagination", description: "Search results show duplicate items when navigating between pages. Root cause: offset calculation doesn't account for new items inserted during browsing." }
      - { id: "VLX-104", title: "Add rate limiting to public API", assignee: "Alice Chen", status: "In Progress", priority: "High", story_points: 5, sprint: "Sprint 14", type: "Feature", tags: "api, security", description: "Implement sliding window rate limiter using Redis. Default: 100 req/min for free tier, 1000 req/min for Pro. Include X-RateLimit headers in responses." }
      - { id: "VLX-105", title: "Write E2E tests for checkout flow", assignee: "David Park", status: "In Progress", priority: "Medium", story_points: 5, sprint: "Sprint 14", type: "Task", tags: "testing, e2e", description: "Playwright E2E tests covering: add to cart, apply coupon, enter shipping, payment (Stripe test mode), order confirmation. Must run in CI under 3 minutes." }
      - { id: "VLX-106", title: "Upgrade React to v19", assignee: "Carol Wu", status: "To Do", priority: "Low", story_points: 8, sprint: "Sprint 14", type: "Task", tags: "frontend, upgrade", description: "Upgrade React from 18.2 to 19.x. Update all deprecated lifecycle methods, test concurrent rendering features, update testing library mocks." }
      - { id: "VLX-107", title: "Mobile-responsive dashboard layout", assignee: "Eve Johnson", status: "To Do", priority: "Medium", story_points: 5, sprint: "Sprint 14", type: "Feature", tags: "frontend, mobile", description: "Make the analytics dashboard responsive for tablets and phones. Collapse sidebar on mobile, stack charts vertically, make tables horizontally scrollable." }
      - { id: "VLX-108", title: "API documentation with OpenAPI spec", assignee: "Bob Martinez", status: "In Review", priority: "Medium", story_points: 3, sprint: "Sprint 14", type: "Task", tags: "docs, api", description: "Write OpenAPI 3.1 spec for all public endpoints. Include request/response examples, error codes, and authentication requirements. Deploy to docs.velox.io." }
      - { id: "VLX-109", title: "Memory leak in WebSocket handler", assignee: "David Park", status: "To Do", priority: "Critical", story_points: 3, sprint: "Sprint 14", type: "Bug", tags: "backend, websocket", description: "Server memory grows ~50MB/hour under load. Suspect WebSocket connections not being cleaned up on client disconnect. Need to add proper connection lifecycle management." }
      - { id: "VLX-110", title: "Dark mode toggle", assignee: "Eve Johnson", status: "In Review", priority: "Low", story_points: 3, sprint: "Sprint 14", type: "Feature", tags: "frontend, ux", description: "Add dark/light mode toggle to settings. Persist preference in localStorage. Use CSS custom properties for theming. Support system preference detection." }
      - { id: "VLX-111", title: "Set up Datadog monitoring", assignee: "Alice Chen", status: "Done", priority: "High", story_points: 5, sprint: "Sprint 14", type: "Task", tags: "infra, monitoring", description: "Configure Datadog APM for all backend services. Set up dashboards for request latency (p50/p95/p99), error rates, and database query performance. Add PagerDuty integration." }
      - { id: "VLX-112", title: "CSV export for reports", assignee: "Bob Martinez", status: "To Do", priority: "Low", story_points: 2, sprint: "Sprint 14", type: "Feature", tags: "export, reports", description: "Add 'Export as CSV' button to all report pages. Stream large datasets to avoid memory issues. Include column headers and proper escaping for special characters." }

  - id: by-status
    title: "Tasks by Status"
    type: chart
    chart:
      mark: bar
      encoding:
        x: { field: status, type: nominal }
        y: { aggregate: count, type: quantitative }
        color: { field: status, type: nominal }
    inline_data: *pm_data

  - id: sprint-stats
    title: "Sprint 14 Overview"
    type: stats
    stats:
      items:
        - { label: "Total tasks", aggregate: count }
        - { label: "Team members", aggregate: distinct, field: assignee }
        - { label: "Total story points", aggregate: sum, field: story_points }
        - { label: "Avg story points", aggregate: avg, field: story_points }
        - { label: "Done", aggregate: count, where: { status: "Done" } }
        - { label: "In Progress", aggregate: count, where: { status: "In Progress" } }
    inline_data: *pm_data

  - id: by-assignee
    title: "Story Points by Assignee"
    type: chart
    chart:
      mark: bar
      encoding:
        x: { field: assignee, type: nominal }
        y: { field: story_points, type: quantitative, aggregate: sum, title: "Story Points" }
        color: { field: assignee, type: nominal }
    inline_data: *pm_data
