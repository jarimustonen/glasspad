  - id: by-category
    title: "Revenue by Category"
    type: chart
    chart:
      mark: arc
      encoding:
        theta: { field: revenue, type: quantitative, aggregate: sum }
        color: { field: category, type: nominal }
    inline_data: *order_data

  - id: popular-items
    title: "Most Ordered Items"
    type: chart
    interactive_filter:
      field: item
    chart:
      mark: bar
      encoding:
        x: { field: item, type: nominal, sort: "-y" }
        y: { field: quantity, type: quantitative, aggregate: sum, title: "Total Quantity" }
        color: { field: category, type: nominal }
    inline_data: *order_data

  - id: restaurant-stats
    title: "Weekly Summary"
    type: stats
    stats:
      items:
        - { label: "Total orders", aggregate: count }
        - { label: "Total revenue ($)", aggregate: sum, field: revenue }
        - { label: "Avg order value ($)", aggregate: avg, field: revenue }
        - { label: "Menu items sold", aggregate: distinct, field: item }
        - { label: "Avg rating", aggregate: avg, field: rating }
        - { label: "Top rating", aggregate: max, field: rating }
    inline_data: *order_data

  - title: "Order Details"
    type: table
    table:
      columns:
        - { field: id, title: "#", sort: number, width: 40 }
        - { field: date, title: "Day", sort: string }
        - { field: time, title: "Time", sort: string }
        - { field: item, title: "Item", sort: string }
        - { field: category, title: "Category", sort: string }
        - { field: quantity, title: "Qty", sort: number }
        - { field: revenue, title: "Revenue ($)", sort: number }
        - { field: rating, title: "Rating", sort: number }
        - { field: server, title: "Server", sort: string }
    inline_data: *order_data
