  - id: latest
    title: "2020 Life Expectancy"
    type: chart
    chart:
      mark: bar
      encoding:
        x: { field: country, type: nominal, sort: "-y" }
        y: { field: life_exp, type: quantitative, title: "Life Expectancy (years)" }
        color: { field: continent, type: nominal }
    inline_data:
      - { country: "Japan", continent: "Asia", life_exp: 84.6 }
      - { country: "Germany", continent: "Europe", life_exp: 81.3 }
      - { country: "China", continent: "Asia", life_exp: 78.1 }
      - { country: "United States", continent: "Americas", life_exp: 77.0 }
      - { country: "Brazil", continent: "Americas", life_exp: 75.9 }
      - { country: "Nigeria", continent: "Africa", life_exp: 55.4 }

  - id: summary
    title: "2020 Summary"
    type: stats
    stats:
      items:
        - { label: "Countries", aggregate: count }
        - { label: "Continents", aggregate: distinct, field: continent }
        - { label: "Avg life expectancy", aggregate: avg, field: life_exp }
        - { label: "Highest", aggregate: max, field: life_exp }
        - { label: "Lowest", aggregate: min, field: life_exp }
    inline_data:
      - { country: "Japan", continent: "Asia", life_exp: 84.6 }
      - { country: "Germany", continent: "Europe", life_exp: 81.3 }
      - { country: "China", continent: "Asia", life_exp: 78.1 }
      - { country: "United States", continent: "Americas", life_exp: 77.0 }
      - { country: "Brazil", continent: "Americas", life_exp: 75.9 }
      - { country: "Nigeria", continent: "Africa", life_exp: 55.4 }

  - title: "Full Data Table"
    type: table
    table:
      columns:
        - { field: country, title: "Country", sort: string }
        - { field: continent, title: "Continent", sort: string }
        - { field: year, title: "Year", sort: number }
        - { field: life_exp, title: "Life Exp.", sort: number }
        - { field: gdp_pc, title: "GDP/capita $", sort: number }
        - { field: pop_m, title: "Pop. (M)", sort: number }
    inline_data: *gap_data
