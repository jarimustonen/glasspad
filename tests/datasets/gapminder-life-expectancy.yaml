    title: "Life Expectancy Over Time"
    type: chart
    interactive_filter:
      field: country
    chart:
      mark: line
      encoding:
        x: { field: year, type: ordinal }
        y: { field: life_exp, type: quantitative, title: "Life Expectancy (years)" }
        color: { field: country, type: nominal }
