    type: chart
    interactive_filter:
      field: class
    chart:
      mark: bar
      encoding:
        x: { field: class, type: nominal }
        y: { aggregate: count, type: quantitative }
        color: { field: survived, type: nominal }
    inline_data: &titanic_data
