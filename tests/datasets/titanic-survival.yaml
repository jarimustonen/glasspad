  - id: survival-by-sex
    title: "Survival by Sex"
    type: chart
    chart:
      mark: arc
      encoding:
        theta: { aggregate: count, type: quantitative }
        color: { field: sex, type: nominal }
    inline_data: *titanic_data

  - id: summary
    title: "Passenger Statistics"
    type: stats
    stats:
      items:
        - { label: "Total passengers", aggregate: count }
        - { label: "Survived", aggregate: count, where: { survived: "Yes" } }
        - { label: "Avg age", aggregate: avg, field: age }
        - { label: "Avg fare (£)", aggregate: avg, field: fare }
        - { label: "Max fare (£)", aggregate: max, field: fare }
        - { label: "Embarkation ports", aggregate: distinct, field: embarked }
    inline_data: *titanic_data

  - title: "Passenger Manifest"
    type: table
    table:
      columns:
        - { field: name, title: "Name", sort: string }
        - { field: class, title: "Class", sort: string }
        - { field: age, title: "Age", sort: number }
        - { field: sex, title: "Sex", sort: string }
        - { field: survived, title: "Survived", sort: string }
        - { field: fare, title: "Fare (£)", sort: number }
        - { field: embarked, title: "Embarked", sort: string }
    inline_data: *titanic_data
