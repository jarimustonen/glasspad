  - id: petal-length
    title: "Avg Petal Length by Species"
    type: chart
    chart:
      mark: bar
      encoding:
        x: { field: species, type: nominal }
        y: { field: petal_length, type: quantitative, aggregate: avg, title: "Avg Petal Length (cm)" }
        color: { field: species, type: nominal }
    inline_data: *iris_data

  - id: stats
    title: "Measurement Statistics"
    type: stats
    stats:
      items:
        - { label: "Total flowers", aggregate: count }
        - { label: "Species", aggregate: distinct, field: species }
        - { label: "Avg sepal length", aggregate: avg, field: sepal_length }
        - { label: "Max petal length", aggregate: max, field: petal_length }
        - { label: "Min petal width", aggregate: min, field: petal_width }
    inline_data: *iris_data

  - title: "Full Dataset"
    type: table
    table:
      columns:
        - { field: id, title: "#", sort: number, width: 40 }
        - { field: species, title: "Species", sort: string }
        - { field: sepal_length, title: "Sepal L.", sort: number }
        - { field: sepal_width, title: "Sepal W.", sort: number }
        - { field: petal_length, title: "Petal L.", sort: number }
        - { field: petal_width, title: "Petal W.", sort: number }
    inline_data: *iris_data
