        # Velox Platform Architecture

        This document describes the high-level architecture of the Velox platform,
        a SaaS application for real-time analytics and reporting.

        ## System Overview

        Velox follows a microservices architecture with an event-driven backbone.
        The system is deployed on Kubernetes across three availability zones.

        ```mermaid
        graph TB
            Client[Web Client] --> CDN[CloudFront CDN]
            CDN --> LB[Load Balancer]
            LB --> API[API Gateway]
            API --> Auth[Auth Service]
            API --> Analytics[Analytics Service]
            API --> Reports[Report Service]
            API --> Notify[Notification Service]
            Analytics --> Kafka[Kafka]
            Reports --> Kafka
            Kafka --> Stream[Stream Processor]
            Stream --> ClickHouse[(ClickHouse)]
            Auth --> Postgres[(PostgreSQL)]
            Analytics --> Redis[(Redis Cache)]
            Reports --> S3[(S3 Storage)]
            Notify --> SQS[SQS Queue]
            SQS --> Lambda[Lambda Workers]
        ```

        ## Service Descriptions

        | Service | Port | Language | Responsibility |
        |---------|------|----------|----------------|
        | API Gateway | 8080 | Go | Routing, rate limiting, request validation |
        | Auth Service | 8081 | Go | OAuth2, JWT, session management |
        | Analytics Service | 8082 | Rust | Event ingestion, real-time aggregation |
        | Report Service | 8083 | Python | Report generation, scheduling, export |
        | Notification Service | 8084 | Node.js | Email, push, webhook delivery |
        | Stream Processor | — | Rust | Kafka consumer, ClickHouse writer |

