  - id: data-flow
    title: "Data Flow"
    type: markdown
    markdown:
      content: |
        ## Event Ingestion Pipeline

        Events flow from client SDKs through the analytics service into the
        data warehouse. The pipeline guarantees at-least-once delivery.

        ```mermaid
        sequenceDiagram
            participant SDK as Client SDK
            participant API as API Gateway
            participant AS as Analytics Service
            participant K as Kafka
            participant SP as Stream Processor
            participant CH as ClickHouse

            SDK->>API: POST /v1/events (batch)
            API->>API: Validate & rate-limit
            API->>AS: Forward events
            AS->>AS: Enrich (geo, device)
            AS->>K: Produce to events topic
            AS-->>API: 202 Accepted
            API-->>SDK: 202 Accepted

            K->>SP: Consume batch
            SP->>SP: Deduplicate & transform
            SP->>CH: Batch insert
            SP->>K: Commit offset
        ```

        ### Processing Guarantees

        - **Ingestion latency**: < 100ms (p99) from SDK to Kafka
        - **End-to-end latency**: < 5s from SDK to queryable in ClickHouse
        - **Deduplication window**: 24 hours (based on event ID)
        - **Retry policy**: 3 attempts with exponential backoff (1s, 5s, 25s)

        ## Database Schema

        ```mermaid
        erDiagram
            USERS ||--o{ WORKSPACES : "belongs to"
            WORKSPACES ||--o{ PROJECTS : contains
            PROJECTS ||--o{ EVENTS : receives
            PROJECTS ||--o{ REPORTS : generates
            USERS ||--o{ API_KEYS : owns

            USERS {
                uuid id PK
                string email
                string name
                timestamp created_at
            }
            WORKSPACES {
                uuid id PK
                string name
                string plan
                uuid owner_id FK
            }
            PROJECTS {
                uuid id PK
                string name
                uuid workspace_id FK
                jsonb settings
            }
            EVENTS {
                uuid id PK
                uuid project_id FK
                string event_type
                jsonb properties
                timestamp timestamp
            }
            REPORTS {
                uuid id PK
                uuid project_id FK
                string type
                jsonb config
                string schedule
            }
            API_KEYS {
                uuid id PK
                uuid user_id FK
                string key_hash
                timestamp expires_at
            }
        ```

