  - id: deployment
    title: "Deployment & Infrastructure"
    type: markdown
    markdown:
      content: |
        ## Deployment Architecture

        ```mermaid
        graph LR
            subgraph CI/CD
                GH[GitHub] --> GHA[GitHub Actions]
                GHA --> ECR[ECR Registry]
            end

            subgraph Kubernetes Cluster
                ECR --> K8S[ArgoCD]
                K8S --> NS1[Namespace: prod]
                K8S --> NS2[Namespace: staging]

                subgraph NS1
                    API1[API x3]
                    AUTH1[Auth x2]
                    ANALYTICS1[Analytics x4]
                    REPORTS1[Reports x2]
                end
            end

            subgraph Data Layer
                PG[(PostgreSQL RDS)]
                CH2[(ClickHouse Cloud)]
                REDIS2[(ElastiCache Redis)]
            end

            NS1 --> PG
            NS1 --> CH2
            NS1 --> REDIS2
        ```

        ## Monitoring Stack

        - **Metrics**: Datadog (custom dashboards, APM traces)
        - **Logging**: Datadog Logs (structured JSON, 30-day retention)
        - **Alerting**: PagerDuty (integrated with Datadog monitors)
        - **Uptime**: Checkly (synthetic checks every 60s)

        ## Key Configuration

        ```yaml
        # Helm values excerpt
        analytics-service:
          replicas: 4
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "2000m", memory: "2Gi" }
          env:
            KAFKA_BROKERS: "kafka-0:9092,kafka-1:9092,kafka-2:9092"
            CLICKHOUSE_URL: "clickhouse.internal:9000"
            BATCH_SIZE: "5000"
            FLUSH_INTERVAL_MS: "1000"
          autoscaling:
            enabled: true
            minReplicas: 4
            maxReplicas: 16
            targetCPU: 70
        ```

        ## Disaster Recovery

        | Component | RPO | RTO | Strategy |
        |-----------|-----|-----|----------|
        | PostgreSQL | 1 min | 15 min | Multi-AZ + automated failover |
        | ClickHouse | 5 min | 30 min | Cross-region replication |
        | Redis | 0 (cache) | 5 min | ElastiCache Multi-AZ |
        | Kafka | 0 | 10 min | 3-broker cluster, RF=3 |
        | S3 | 0 | 0 | Cross-region replication |
