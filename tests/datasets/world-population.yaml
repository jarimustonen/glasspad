spec_version: 1
title: "World Population by Country (2023)"
description: "Top 15 countries by population — based on World Bank data"
layout: grid-2col

sections:
  - id: by-country
    title: "Population by Country"
    type: chart
    interactive_filter:
      field: country
    chart:
      mark: bar
      encoding:
        x: { field: country, type: nominal, sort: "-y" }
        y: { field: population_m, type: quantitative, title: "Population (millions)" }
        color: { field: continent, type: nominal }
    inline_data: &pop_data
      - { country: "China", continent: "Asia", population_m: 1412, density_km2: 151, urban_pct: 65, gdp_per_capita: 12720, life_expectancy: 78.2 }
      - { country: "India", continent: "Asia", population_m: 1408, density_km2: 470, urban_pct: 36, gdp_per_capita: 2612, life_expectancy: 70.8 }
      - { country: "United States", continent: "North America", population_m: 335, density_km2: 37, urban_pct: 83, gdp_per_capita: 76330, life_expectancy: 77.5 }
      - { country: "Indonesia", continent: "Asia", population_m: 277, density_km2: 153, urban_pct: 58, gdp_per_capita: 4788, life_expectancy: 71.7 }
      - { country: "Pakistan", continent: "Asia", population_m: 231, density_km2: 300, urban_pct: 37, gdp_per_capita: 1505, life_expectancy: 66.5 }
      - { country: "Nigeria", continent: "Africa", population_m: 223, density_km2: 246, urban_pct: 54, gdp_per_capita: 2184, life_expectancy: 55.4 }
      - { country: "Brazil", continent: "South America", population_m: 216, density_km2: 26, urban_pct: 88, gdp_per_capita: 8918, life_expectancy: 75.5 }
      - { country: "Bangladesh", continent: "Asia", population_m: 173, density_km2: 1329, urban_pct: 40, gdp_per_capita: 2688, life_expectancy: 72.4 }
      - { country: "Russia", continent: "Europe", population_m: 144, density_km2: 9, urban_pct: 75, gdp_per_capita: 12195, life_expectancy: 73.2 }
      - { country: "Ethiopia", continent: "Africa", population_m: 126, density_km2: 127, urban_pct: 23, gdp_per_capita: 1027, life_expectancy: 66.6 }
      - { country: "Mexico", continent: "North America", population_m: 128, density_km2: 67, urban_pct: 81, gdp_per_capita: 10948, life_expectancy: 75.1 }
      - { country: "Japan", continent: "Asia", population_m: 124, density_km2: 338, urban_pct: 92, gdp_per_capita: 33815, life_expectancy: 84.8 }
      - { country: "Philippines", continent: "Asia", population_m: 117, density_km2: 393, urban_pct: 48, gdp_per_capita: 3623, life_expectancy: 71.1 }
      - { country: "Egypt", continent: "Africa", population_m: 112, density_km2: 113, urban_pct: 43, gdp_per_capita: 3699, life_expectancy: 72.0 }
      - { country: "DR Congo", continent: "Africa", population_m: 102, density_km2: 45, urban_pct: 47, gdp_per_capita: 584, life_expectancy: 60.7 }

  - id: by-continent
    title: "Population Share by Continent"
    type: chart
    chart:
      mark: arc
      encoding:
        theta: { field: population_m, type: quantitative, aggregate: sum }
        color: { field: continent, type: nominal }
    inline_data: *pop_data

  - id: summary
    title: "Global Overview"
    type: stats
    stats:
      items:
        - { label: "Countries", aggregate: count }
        - { label: "Continents", aggregate: distinct, field: continent }
        - { label: "Total population (M)", aggregate: sum, field: population_m }
        - { label: "Avg life expectancy", aggregate: avg, field: life_expectancy }
        - { label: "Avg GDP per capita", aggregate: avg, field: gdp_per_capita }
        - { label: "Highest density", aggregate: max, field: density_km2 }
    inline_data: *pop_data

  - title: "Country Details"
    type: table
    table:
      columns:
        - { field: country, title: "Country", sort: string }
        - { field: continent, title: "Continent", sort: string }
        - { field: population_m, title: "Pop. (M)", sort: number }
        - { field: density_km2, title: "Density/km²", sort: number }
        - { field: urban_pct, title: "Urban %", sort: number }
        - { field: gdp_per_capita, title: "GDP/capita $", sort: number }
        - { field: life_expectancy, title: "Life Exp.", sort: number }
    inline_data: *pop_data
