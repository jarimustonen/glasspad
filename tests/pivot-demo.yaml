spec_version: 1
title: "Northwave Solutions — Sales Pivot"
description: "Pivot table demo: sales by region, product category, and segment"
layout: stack
datasets:
  sales: {}
sections:
  - title: "Revenue by Region & Product Category"
    type: pivot
    source: sales
    pivot:
      rows:
        - region
        - product_category
      columns:
        - segment
      values:
        - field: total_amount
          aggregate: sum
          label: "Revenue"
          format: currency
          currency: USD
        - field: quantity
          aggregate: sum
          label: "Units"
      show_totals: true
      show_subtotals: true
      sort:
        by: value
        direction: desc
        value_index: 0

  - title: "Revenue by Country"
    type: pivot
    source: sales
    pivot:
      rows:
        - country
      columns:
        - product_category
      values:
        - field: total_amount
          aggregate: sum
          label: "Revenue"
          format: currency
          currency: USD
      show_totals: true

  - title: "Average Order Value by Payment Type"
    type: pivot
    source: sales
    pivot:
      rows:
        - payment_type
      values:
        - field: total_amount
          aggregate: avg
          label: "Avg Order"
          format: currency
          currency: USD
        - aggregate: count
          label: "Orders"
        - field: total_amount
          aggregate: sum
          label: "Total Revenue"
          format: currency
          currency: USD
