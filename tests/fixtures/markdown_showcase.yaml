        ## Definition-Style Content

        **Glasspad**
        : An AI-friendly scratchpad for rich data views.

        **Section**
        : A visual component in a dashboard — chart, table, stats, list, or markdown.

        ## Mixed Formatting in Lists

        1. **Install Rust** — visit [rustup.rs](https://rustup.rs) and run:
           ```bash
           curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh
           ```
        2. **Clone and build**:
           ```bash
           git clone https://github.com/example/glasspad
           cd glasspad && cargo build
           ```
        3. **Create your first pad** with inline data:
           ```yaml
           spec_version: 1
           title: "Hello World"
           sections:
             - title: "Welcome"
               type: markdown
               markdown:
                 content: "# It works!"
           ```

        ## Escaped Characters

        Use backslashes to show literal characters: \*not italic\*, \`not code\`, \# not a heading.

