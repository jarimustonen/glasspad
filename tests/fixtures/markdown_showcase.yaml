  - id: code
    title: "Code Blocks"
    type: markdown
    markdown:
      content: |
        ## Syntax-Highlighted Code

        ### Rust

        ```rust
        use serde::{Deserialize, Serialize};

        #[derive(Debug, Clone, Serialize, Deserialize)]
        #[serde(deny_unknown_fields)]
        pub struct MarkdownConfig {
            pub content: Option<String>,
            pub content_field: Option<String>,
        }

        fn render(config: &MarkdownConfig) -> String {
            match &config.content {
                Some(text) => text.clone(),
                None => String::from("No content provided"),
            }
        }
        ```

        ### Python

        ```python
        import pandas as pd
        from dataclasses import dataclass

        @dataclass
        class DashboardSpec:
            title: str
            sections: list[dict]
            layout: str = "grid-2col"

            def validate(self) -> list[str]:
                errors = []
                if not self.sections:
                    errors.append("sections list is empty")
                for i, section in enumerate(self.sections):
                    if "type" not in section:
                        errors.append(f"section {i}: missing type")
                return errors
        ```

        ### JavaScript

        ```javascript
        function mountMarkdown(container, section) {
          const config = section.markdown;
          const el = document.createElement('div');
          el.className = 'markdown-body';

          const content = config.content ?? '';
          el.innerHTML = marked.parse(content);

          // Apply syntax highlighting
          el.querySelectorAll('pre code').forEach(block => {
            hljs.highlightElement(block);
          });

          container.appendChild(el);
        }
        ```

        ### SQL

        ```sql
        SELECT
          country,
          COUNT(*) AS total_events,
          COUNT(DISTINCT device) AS unique_devices,
          ROUND(AVG(duration_ms), 2) AS avg_duration
        FROM events
        WHERE created_at >= '2026-01-01'
        GROUP BY country
        ORDER BY total_events DESC
        LIMIT 20;
        ```

        ### YAML

        ```yaml
        spec_version: 1
        title: "My Dashboard"
        layout: stack
        sections:
          - title: "Overview"
            type: markdown
            markdown:
              content: "# Hello from Glasspad"
        ```

        ### Shell

        ```bash
        #!/bin/bash
        set -euo pipefail

        echo "Starting Glasspad..."
        cargo build --release
        ./target/release/glasspad serve --port 3000 &

        curl -s -X POST http://localhost:3000/api/pads \
          -H "Content-Type: application/x-yaml" \
          -d @dashboard.yaml | jq '.url'
        ```

