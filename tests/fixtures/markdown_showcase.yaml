    type: markdown
    markdown:
      content: |
        # Glasspad Markdown Rendering

        Welcome to the **Markdown Showcase**. This pad demonstrates all supported formatting features in Glasspad's new `markdown` section type. Everything you see is rendered client-side using [marked.js](https://marked.js.org/) with syntax highlighting powered by [highlight.js](https://highlightjs.org/).

        ---

