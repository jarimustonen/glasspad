spec_version: 1
title: "Chart Variants — Visual Test"
description: "Covers all chart marks (bar, line, arc) and interactive filtering"
layout: grid-2col

sections:
  # --- Bar chart with x/y encoding ---
  - id: bar-revenue
    title: "Monthly Revenue (Bar)"
    type: chart
    chart:
      mark: bar
      encoding:
        x: { field: month, type: ordinal }
        y: { field: revenue, type: quantitative, aggregate: sum }
        color: { field: region, type: nominal }
    interactive_filter:
      field: region
    inline_data:
      - { month: "Jan", region: "North", revenue: 42000 }
      - { month: "Jan", region: "South", revenue: 38000 }
      - { month: "Jan", region: "East", revenue: 29000 }
      - { month: "Feb", region: "North", revenue: 45000 }
      - { month: "Feb", region: "South", revenue: 41000 }
      - { month: "Feb", region: "East", revenue: 33000 }
      - { month: "Mar", region: "North", revenue: 51000 }
      - { month: "Mar", region: "South", revenue: 44000 }
      - { month: "Mar", region: "East", revenue: 36000 }
      - { month: "Apr", region: "North", revenue: 48000 }
      - { month: "Apr", region: "South", revenue: 47000 }
      - { month: "Apr", region: "East", revenue: 39000 }

  # --- Line chart with temporal x-axis ---
  - id: line-temperature
    title: "Daily Temperature (Line)"
    type: chart
    chart:
      mark: line
      encoding:
        x: { field: date, type: temporal }
        y: { field: temp_c, type: quantitative }
        color: { field: city, type: nominal }
    inline_data:
      - { date: "2026-03-01", city: "Helsinki", temp_c: -4.2 }
      - { date: "2026-03-02", city: "Helsinki", temp_c: -2.8 }
      - { date: "2026-03-03", city: "Helsinki", temp_c: -1.5 }
      - { date: "2026-03-04", city: "Helsinki", temp_c: 0.3 }
      - { date: "2026-03-05", city: "Helsinki", temp_c: 1.8 }
      - { date: "2026-03-06", city: "Helsinki", temp_c: 3.2 }
      - { date: "2026-03-07", city: "Helsinki", temp_c: 2.1 }
      - { date: "2026-03-01", city: "Stockholm", temp_c: 1.0 }
      - { date: "2026-03-02", city: "Stockholm", temp_c: 2.3 }
      - { date: "2026-03-03", city: "Stockholm", temp_c: 3.1 }
      - { date: "2026-03-04", city: "Stockholm", temp_c: 4.5 }
      - { date: "2026-03-05", city: "Stockholm", temp_c: 5.0 }
      - { date: "2026-03-06", city: "Stockholm", temp_c: 6.2 }
      - { date: "2026-03-07", city: "Stockholm", temp_c: 4.8 }
      - { date: "2026-03-01", city: "Tallinn", temp_c: -3.0 }
      - { date: "2026-03-02", city: "Tallinn", temp_c: -1.5 }
      - { date: "2026-03-03", city: "Tallinn", temp_c: -0.2 }
      - { date: "2026-03-04", city: "Tallinn", temp_c: 1.1 }
      - { date: "2026-03-05", city: "Tallinn", temp_c: 2.4 }
      - { date: "2026-03-06", city: "Tallinn", temp_c: 3.9 }
      - { date: "2026-03-07", city: "Tallinn", temp_c: 2.7 }

  # --- Arc/pie chart with theta/color ---
  - id: arc-expenses
    title: "Expense Breakdown (Arc)"
    type: chart
    chart:
      mark: arc
      encoding:
        theta: { field: amount, type: quantitative, aggregate: sum }
        color: { field: category, type: nominal }
    inline_data:
      - { category: "Engineering", amount: 185000 }
      - { category: "Marketing", amount: 92000 }
      - { category: "Operations", amount: 67000 }
      - { category: "Sales", amount: 124000 }
      - { category: "Support", amount: 53000 }
      - { category: "R&D", amount: 141000 }

  # --- Bar chart with interactive filter on a different field ---
  - id: bar-filtered-sales
    title: "Sales by Product (Filterable)"
    type: chart
    interactive_filter:
      field: product
    chart:
      mark: bar
      encoding:
        x: { field: product, type: nominal }
        y: { field: units, type: quantitative, aggregate: sum }
    inline_data:
      - { product: "Widget A", units: 320 }
      - { product: "Widget B", units: 215 }
      - { product: "Widget C", units: 480 }
      - { product: "Widget D", units: 175 }
      - { product: "Widget E", units: 390 }
