spec_version: 1
title: "Dark Theme — Visual Test"
description: "Tests grid-3col layout with dark theme"
layout: grid-3col
theme: dark

sections:
  - id: dark-chart
    title: "Monthly Signups"
    type: chart
    chart:
      mark: line
      encoding:
        x: { field: month, type: ordinal }
        y: { field: signups, type: quantitative }
    inline_data:
      - { month: "Jan", signups: 340 }
      - { month: "Feb", signups: 420 }
      - { month: "Mar", signups: 510 }
      - { month: "Apr", signups: 475 }
      - { month: "May", signups: 620 }
      - { month: "Jun", signups: 580 }

  - id: dark-stats
    title: "Quick Stats"
    type: stats
    stats:
      items:
        - { label: "Total Signups", aggregate: sum, field: signups }
        - { label: "Peak Month", aggregate: max, field: signups }
    inline_data:
      - { month: "Jan", signups: 340 }
      - { month: "Feb", signups: 420 }
      - { month: "Mar", signups: 510 }
      - { month: "Apr", signups: 475 }
      - { month: "May", signups: 620 }
      - { month: "Jun", signups: 580 }

  - id: dark-pie
    title: "Traffic Sources"
    type: chart
    chart:
      mark: arc
      encoding:
        theta: { field: visits, type: quantitative }
        color: { field: source, type: nominal }
    inline_data:
      - { source: "Organic", visits: 4500 }
      - { source: "Paid", visits: 2100 }
      - { source: "Referral", visits: 1800 }
      - { source: "Direct", visits: 3200 }

  - id: dark-table
    title: "Top Pages"
    type: table
    table:
      columns:
        - { field: page, title: "Page" }
        - { field: views, title: "Views", sort: number }
    inline_data:
      - { page: "/home", views: 12400 }
      - { page: "/pricing", views: 8900 }
      - { page: "/docs", views: 7200 }
      - { page: "/blog", views: 5600 }

  - id: dark-list
    title: "Recent Events"
    type: list
    list:
      id_field: id
      layout: compact
      title_field: event
      meta_field: time
    inline_data:
      - { id: 1, event: "Deploy v2.14.3 completed", time: "2 min ago" }
      - { id: 2, event: "Alert resolved: CPU spike", time: "15 min ago" }
      - { id: 3, event: "New user signup: acme.com", time: "1 hour ago" }

  - id: dark-markdown
    title: "Status"
    type: markdown
    markdown:
      content: |
        All systems **operational**. Dark theme should render with:
        - Light text on dark backgrounds
        - Properly contrasted chart colors
        - Readable table rows
