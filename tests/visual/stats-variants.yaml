spec_version: 1
title: "Stats Variants — Visual Test"
description: "Covers all stat aggregates (count, distinct, sum, avg, min, max) and where filters"
layout: grid-2col

sections:
  # --- All aggregate types ---
  - id: order-stats
    title: "Order Statistics"
    type: stats
    stats:
      items:
        - { label: "Total Orders", aggregate: count }
        - { label: "Unique Customers", aggregate: distinct, field: customer }
        - { label: "Total Revenue", aggregate: sum, field: revenue }
        - { label: "Avg Order Value", aggregate: avg, field: revenue }
        - { label: "Smallest Order", aggregate: min, field: revenue }
        - { label: "Largest Order", aggregate: max, field: revenue }
    inline_data: &order_data
      - { id: 1, customer: "Acme Corp", product: "Enterprise", revenue: 15000, status: "completed", region: "North" }
      - { id: 2, customer: "Globex Inc", product: "Starter", revenue: 2500, status: "completed", region: "South" }
      - { id: 3, customer: "Acme Corp", product: "Pro", revenue: 8000, status: "pending", region: "North" }
      - { id: 4, customer: "Initech", product: "Enterprise", revenue: 15000, status: "completed", region: "East" }
      - { id: 5, customer: "Soylent", product: "Starter", revenue: 2500, status: "refunded", region: "West" }
      - { id: 6, customer: "Globex Inc", product: "Pro", revenue: 8000, status: "completed", region: "South" }
      - { id: 7, customer: "Umbrella Co", product: "Enterprise", revenue: 15000, status: "completed", region: "North" }
      - { id: 8, customer: "Initech", product: "Pro", revenue: 8000, status: "pending", region: "East" }
      - { id: 9, customer: "Wayne Ent", product: "Starter", revenue: 2500, status: "completed", region: "West" }
      - { id: 10, customer: "Stark Ind", product: "Enterprise", revenue: 15000, status: "completed", region: "North" }

  # --- Where-filtered stats ---
  - id: filtered-stats
    title: "Filtered Order Insights"
    type: stats
    stats:
      items:
        - { label: "Completed Orders", aggregate: count, where: { status: "completed" } }
        - { label: "Pending Orders", aggregate: count, where: { status: "pending" } }
        - { label: "Refunded Orders", aggregate: count, where: { status: "refunded" } }
        - { label: "Completed Revenue", aggregate: sum, field: revenue, where: { status: "completed" } }
        - { label: "Enterprise Deals", aggregate: count, where: { product: "Enterprise" } }
        - { label: "North Region Revenue", aggregate: sum, field: revenue, where: { region: "North" } }
    inline_data: *order_data

  # --- Different data view ---
  - id: website-stats
    title: "Website Traffic"
    type: stats
    stats:
      items:
        - { label: "Total Visits", aggregate: count }
        - { label: "Unique Pages", aggregate: distinct, field: page }
        - { label: "Avg Session (sec)", aggregate: avg, field: duration_sec }
        - { label: "Max Session (sec)", aggregate: max, field: duration_sec }
        - { label: "Bounce Rate Visits", aggregate: count, where: { bounced: true } }
    inline_data:
      - { page: "/home", duration_sec: 45, bounced: false }
      - { page: "/pricing", duration_sec: 120, bounced: false }
      - { page: "/docs", duration_sec: 300, bounced: false }
      - { page: "/home", duration_sec: 5, bounced: true }
      - { page: "/blog/release-notes", duration_sec: 180, bounced: false }
      - { page: "/pricing", duration_sec: 8, bounced: true }
      - { page: "/docs", duration_sec: 250, bounced: false }
      - { page: "/signup", duration_sec: 60, bounced: false }
      - { page: "/home", duration_sec: 30, bounced: false }
      - { page: "/blog/tutorial", duration_sec: 420, bounced: false }
