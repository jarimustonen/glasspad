      content: |
        # API Reference

        Welcome to the **Glasspad API Reference**. This document covers all endpoints and their parameters.

        ## Authentication

        All API requests require a bearer token:

        ```bash
        curl -H "Authorization: Bearer YOUR_TOKEN" \
          https://api.example.com/pads
        ```

        > **Note:** Tokens expire after 24 hours. Use the `/auth/refresh` endpoint to obtain a new token.

        ## Endpoints

        ### POST /api/pads

        Create a new pad from a YAML spec.

        | Parameter     | Type   | Required | Description                |
        |---------------|--------|----------|----------------------------|
        | Content-Type  | Header | Yes      | Must be application/x-yaml |
        | spec          | Body   | Yes      | The YAML dashboard spec    |
        | ttl           | Query  | No       | Time-to-live in seconds    |

        ### GET /api/pads/:id

        Retrieve a pad by its unique identifier.

        ### DELETE /api/pads/:id

        Delete a pad permanently. Returns `204 No Content` on success.

        ## Data Types

        Supported data types in inline datasets:

        - **string** — text values
        - **number** — integers and floats
        - **boolean** — `true` or `false`
        - **null** — missing values

        ## Rate Limits

        | Tier       | Requests/min | Burst |
        |------------|-------------|-------|
        | Free       | 60          | 10    |
        | Pro        | 600         | 50    |
        | Enterprise | 6000        | 200   |

        ---

        *Last updated: April 2026*

