spec_version: 1
title: "Table Variants — Visual Test"
description: "Covers table columns, sort types, row actions, selectable rows, and batch actions"
layout: stack

sections:
  # --- Table with all sort types ---
  - id: employee-table
    title: "Employee Directory"
    type: table
    table:
      columns:
        - { field: id, title: "ID", sort: number, width: 60 }
        - { field: name, title: "Name", sort: string }
        - { field: department, title: "Department", sort: string }
        - { field: salary, title: "Salary ($)", sort: number, width: 120 }
        - { field: hired, title: "Hired", sort: temporal, width: 120 }
        - { field: active, title: "Active", sort: boolean, width: 80 }
      row_id_field: id
      row_actions:
        - { id: promote, label: "Promote", style: success }
        - { id: transfer, label: "Transfer" }
        - { id: terminate, label: "Terminate", style: danger }
    selectable: true
    batch_actions:
      - { id: export, label: "Export Selected" }
      - { id: bulk-deactivate, label: "Deactivate", style: danger }
