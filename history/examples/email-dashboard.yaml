spec_version: 1
title: "Email Search Results"
description: "Search: all messages from last 7 days"
layout: stack
toc: true

datasets:
  emails: {}

sections:
  - id: summary
    title: "Summary"
    type: stats
    source: emails
    stats:
      items:
        - { label: "Total", aggregate: count }
        - { label: "Unread", aggregate: count, where: { is_read: false } }
        - { label: "Flagged", aggregate: count, where: { is_flagged: true } }
        - { label: "With attachments", aggregate: count, where: { has_attachments: true } }

  - id: by-folder
    title: "By folder"
    type: chart
    source: emails
    interactive_filter:
      field: folder
    chart:
      mark: bar
      encoding:
        x: { aggregate: count, type: quantitative }
        y: { field: folder, type: nominal, sort: "-x" }

  - id: timeline
    title: "Messages over time"
    type: chart
    source: emails
    chart:
      mark: bar
      encoding:
        x: { field: date, type: temporal, timeUnit: day }
        y: { aggregate: count, type: quantitative, title: "messages" }

  - id: all-messages
    title: "All messages"
    type: table
    source: emails
    table:
      columns:
        - { field: date, title: "Date", sort: temporal }
        - { field: from_name, title: "From" }
        - { field: subject, title: "Subject" }
        - { field: folder, title: "Folder" }
        - { field: tags, title: "Tags" }
        - { field: has_attachments, title: "Att." }
        - { field: is_read, title: "Read" }
