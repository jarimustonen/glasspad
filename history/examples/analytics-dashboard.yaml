spec_version: 1
title: "3dbear.io — Site Analytics (24h)"
description: "Interactive dashboard with filtering. Click any chart to filter."
layout: grid-2col

datasets:
  events: {}

sections:
  - id: events-per-hour
    title: "Events per hour"
    type: chart
    source: events
    chart:
      mark: bar
      encoding:
        x: { field: datetime, type: temporal, timeUnit: hours }
        y: { aggregate: count, type: quantitative, title: "events" }

  - id: by-country
    title: "By country"
    type: chart
    source: events
    interactive_filter:
      field: country
    chart:
      mark: bar
      encoding:
        x: { aggregate: count, type: quantitative }
        y: { field: country, type: nominal, sort: "-x" }

  - id: by-device
    title: "By device"
    type: chart
    source: events
    interactive_filter:
      field: device
    chart:
      mark: arc
      encoding:
        theta: { aggregate: count, type: quantitative }
        color: { field: device, type: nominal }

  - id: by-referrer
    title: "By referrer"
    type: chart
    source: events
    interactive_filter:
      field: referrer
    chart:
      mark: bar
      encoding:
        x: { aggregate: count, type: quantitative }
        y: { field: referrer, type: nominal, sort: "-x" }

  - id: top-pages
    title: "Top pages"
    type: chart
    source: events
    interactive_filter:
      field: path
    chart:
      mark: bar
      encoding:
        x: { aggregate: count, type: quantitative }
        y: { field: path, type: nominal, sort: "-x" }

  - id: summary
    title: "Summary"
    type: stats
    source: events
    stats:
      items:
        - { label: "Total events", aggregate: count }
        - { label: "Visits", aggregate: count, where: { event_type: "visit" } }
        - { label: "Pageviews", aggregate: count, where: { event_type: "pageview" } }
        - { label: "Countries", aggregate: distinct, field: country }

  - id: all-events
    title: "All events"
    type: table
    source: events
    table:
      columns:
        - { field: datetime, title: "Time" }
        - { field: path, title: "Page" }
        - { field: referrer, title: "Referrer" }
        - { field: country, title: "Country" }
        - { field: device, title: "Device" }
        - { field: browser, title: "Browser" }
        - { field: os, title: "OS" }
        - { field: event_type, title: "Type" }
