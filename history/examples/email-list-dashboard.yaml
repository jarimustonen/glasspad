spec_version: 1
title: "Email Inbox"
description: "Search: all messages from last 7 days"
layout: stack
toc: true

datasets:
  emails: {}

sections:
  - id: summary
    title: "Summary"
    type: stats
    source: emails
    stats:
      items:
        - { label: "Total", aggregate: count }
        - { label: "Unread", aggregate: count, where: { is_read: false } }
        - { label: "Flagged", aggregate: count, where: { is_flagged: true } }
        - { label: "Senders", aggregate: distinct, field: from_name }

  - id: by-sender
    title: "By sender"
    type: chart
    source: emails
    interactive_filter:
      field: from_name
    chart:
      mark: bar
      encoding:
        x: { aggregate: count, type: quantitative }
        y: { field: from_name, type: nominal, sort: "-x" }

  - id: by-folder
    title: "By folder"
    type: chart
    source: emails
    interactive_filter:
      field: folder
    chart:
      mark: bar
      encoding:
        x: { aggregate: count, type: quantitative }
        y: { field: folder, type: nominal, sort: "-x" }

  - id: timeline
    title: "Messages over time"
    type: chart
    source: emails
    chart:
      mark: bar
      encoding:
        x: { field: date, type: temporal, timeUnit: yearmonthdate }
        y: { aggregate: count, type: quantitative, title: "messages" }

  - id: inbox
    title: "Messages"
    type: list
    source: emails
    list:
      id_field: id
      layout: cards
      title_field: subject
      subtitle_field: from_name
      meta_field: date
      preview_field: tags
      detail:
        fields:
          - { field: from, title: "From" }
          - { field: to, title: "To" }
          - { field: date, title: "Date" }
          - { field: folder, title: "Folder" }
          - { field: tags, title: "Tags" }
          - { field: attachments, title: "Attachments" }
        body_field: body
        body_format: sanitized_html
