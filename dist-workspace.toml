[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist). The tag-triggered `.github/workflows/release.yml`
# is GENERATED from this [dist] section via `dist generate` — edit config here,
# then regenerate; never hand-edit the workflow. Matches the shipshape / issuectl /
# orchestratectl release convention.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.2"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Homebrew tap repository for the auto-generated formula.
# Per-tool tap convention (matches homebrew-shipshape / homebrew-issuectl /
# homebrew-orchestratectl): repo `homebrew-glasspad` →
# `brew install jarimustonen/glasspad/glasspad`.
tap = "jarimustonen/homebrew-glasspad"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax).
# macOS Apple Silicon + Linux (arm64 + x86_64). The Linux targets build on the
# GitHub-hosted ubuntu runners (only the mac target is routed to hauis, below), and
# they use gnu, not musl: gnu is the proven low-friction default on those runners,
# whereas musl would need musl-tools set up in CI plus per-target compatibility
# work — for a glibc-independent static binary this project doesn't need. (reqwest
# is configured with rustls-tls, not native-tls, so OpenSSL is NOT part of this
# rationale — a musl build would in fact link fine here; it's simply not worth the
# CI setup.) Unlike the pure-Rust shipshape (which uses musl for exactly that
# glibc-independence), glasspad stays on gnu.
#
# x86_64-apple-darwin is intentionally NOT built: the configured macOS release
# runner is Apple Silicon with Homebrew Rust (no rustup / no x86_64 std), so it
# cannot cross-compile the Intel target. Windows is not a binary target;
# Windows/Intel-Mac users install via `cargo install glasspad`.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# Generate GitHub build-provenance attestations for the release artifacts
# (`gh attestation verify`) — a native, secret-free supply-chain signal for a CLI
# whose install path is curl-to-shell / Homebrew. cargo-dist scopes the extra
# id-token / attestations permissions to the publishing job.
github-attestations = true

# Route the macOS build to the operator's self-hosted Apple Silicon runner.
# The two Linux targets stay on GitHub-hosted Ubuntu runners. This personal,
# non-standard infrastructure override is deliberately under review; do not copy
# it as a project default. Removing it before a viable macOS replacement exists
# would break the release's cross-platform binary coverage.
[dist.github-custom-runners]
aarch64-apple-darwin = "self-hosted"
