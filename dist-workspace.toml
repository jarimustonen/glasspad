[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist). The tag-triggered `.github/workflows/release.yml`
# is GENERATED from this [dist] section via `dist generate` — edit config here,
# then regenerate; never hand-edit the workflow. Matches the ossctl / issuectl /
# orchestratectl release convention.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.2"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Homebrew tap repository for the auto-generated formula.
# Per-tool tap convention (matches homebrew-ossctl / homebrew-issuectl /
# homebrew-orchestratectl): repo `homebrew-glasspad` →
# `brew install jarimustonen/glasspad/glasspad`.
tap = "jarimustonen/homebrew-glasspad"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax).
# macOS Apple Silicon + Linux (arm64 + x86_64). gnu (not musl) because glasspad
# pulls reqwest→native-tls (OpenSSL), which is painful to statically link on musl.
#
# x86_64-apple-darwin is intentionally NOT built: the only always-on macOS release
# runner is `hauis` (Apple Silicon, Homebrew Rust = no rustup / no x86_64 std), so
# it cannot cross-compile the Intel target. Windows is not a target (Jari installs
# on macOS + Linux); Windows/Intel-Mac users install via `cargo install glasspad`.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# Generate GitHub build-provenance attestations for the release artifacts
# (`gh attestation verify`) — a native, secret-free supply-chain signal for a CLI
# whose install path is curl-to-shell / Homebrew. cargo-dist scopes the extra
# id-token / attestations permissions to the publishing job.
github-attestations = true

# Route the macOS build to a GitHub-hosted Apple-Silicon runner (`macos-14`), so
# releases don't depend on the self-hosted `hauis` machine. The two Linux targets
# stay on GitHub-hosted ubuntu runners. GitHub-hosted runners get a clean,
# job-scoped checkout each run — no shared global ~/.gitconfig, so none of the
# stale-auth-extraheader / git-400 hazard that the self-hosted single runner had.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-14"
