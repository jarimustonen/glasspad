<style>
/* Glasspad built-in template: board — read-only status view.
   Script groups each h2 into a lane and infers status from the heading text;
   without script, headings + lists still form a ruled board of task cards. */
.gp-board { max-width: 90rem; margin-inline: auto; }
.gp-board h1 { font-size: 1.5rem; letter-spacing: -0.015em; margin: 0 0 0.25rem; }
.gp-board p { margin: 0 0 0.75rem; }
.gp-board a:focus-visible { outline: 2px solid var(--gp-focus); outline-offset: 2px; border-radius: 2px; }

.gp-board-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.25rem 2rem;
  margin: 0 0 1rem;
}
.gp-board-head > h1 { margin: 0; }
.gp-board-head > p { margin: 0; font-size: 0.8125rem; color: var(--gp-text-muted); }

/* Status summary chips (generated from the lanes). */
.gp-board-tally {
  display: flex;
  flex-wrap: wrap;
  gap: 0.375rem;
  margin: 0 0 1.25rem;
  padding: 0;
  list-style: none;
}
.gp-board-tally > li {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.25rem 0.625rem;
  border-radius: 999px;
  background: var(--gp-status-bg, var(--gp-surface-alt));
  color: var(--gp-status-fg, var(--gp-text-secondary));
  font-size: 0.75rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.gp-board-lanes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr));
  gap: 1rem;
  align-items: start;
}
.gp-board-lane {
  min-width: 0;
  padding: 0.75rem;
  background: var(--gp-surface-alt);
  border-radius: 12px;
}
.gp-board-lane.gp-status-blocked { box-shadow: inset 0 0 0 1px var(--gp-status); }
.gp-board-lane.is-wide {
  grid-column: 1 / -1;
  padding: 1rem 1.25rem 1.25rem;
  background: var(--gp-surface);
  border: 1px solid var(--gp-border);
  box-shadow: var(--gp-shadow);
}
.gp-board-lane.is-wide.gp-status-blocked {
  border-color: var(--gp-status);
  box-shadow: inset 0 0 0 1px var(--gp-status), var(--gp-shadow);
}
.gp-board-lane > :last-child { margin-bottom: 0; }

/* Lane / group headings: glyph + written state + count. */
.gp-board h2 {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin: 0.125rem 0.25rem 0.75rem;
  font-size: 0.875rem;
  font-weight: 600;
  line-height: 1.3;
  text-transform: none;
  letter-spacing: 0;
  color: var(--gp-text);
}
.gp-board [data-status] > h2::before {
  content: "";
  flex: none;
  display: grid;
  place-items: center;
  width: 1.25rem;
  height: 1.25rem;
  border-radius: 4px;
  background: var(--gp-status-bg);
  box-shadow: inset 0 0 0 1.5px var(--gp-status);
  color: var(--gp-status-fg);
  font-size: 0.75rem;
  font-weight: 700;
  line-height: 1;
}
.gp-board [data-status="done"] > h2::before { content: "\2713" / ""; }
.gp-board [data-status="next"] > h2::before { content: "\2192" / ""; }
.gp-board [data-status="blocked"] > h2::before { content: "!" / ""; }
.gp-board [data-status="future"] > h2::before { content: "\2026" / ""; }
.gp-board-count {
  margin-inline-start: auto;
  font-size: 0.75rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--gp-text-muted);
}
.gp-vh {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* Task cards: any top-level list item under a group. */
.gp-board > ul:not(.gp-board-tally),
.gp-board-lane > ul {
  display: grid;
  gap: 0.5rem;
  margin: 0 0 0.75rem;
  padding: 0;
  list-style: none;
}
.gp-board > ul:not(.gp-board-tally) {
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr));
}
.gp-board > ul:not(.gp-board-tally) > li,
.gp-board-lane > ul > li {
  margin: 0;
  padding: 0.625rem 0.75rem;
  background: var(--gp-surface);
  border: 1px solid var(--gp-border);
  border-radius: 8px;
  box-shadow: var(--gp-shadow);
  font-size: 0.8125rem;
  line-height: 1.45;
  color: var(--gp-text-secondary);
  overflow-wrap: anywhere;
}
.gp-board li > strong:first-child {
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--gp-text);
}
.gp-board[data-gp-enhanced] li > strong:first-child { display: block; margin-bottom: 0.125rem; }
.gp-board-meta {
  display: flex;
  gap: 0.375rem;
  margin-top: 0.5rem;
  padding-top: 0.5rem;
  border-top: 1px solid var(--gp-border);
  font-size: 0.75rem;
  color: var(--gp-text-muted);
}
.gp-board-meta b { font-weight: 600; color: var(--gp-text-secondary); }
.gp-board li li { padding: 0; border: 0; background: none; box-shadow: none; }
.gp-board li:has(> input[type="checkbox"]:first-child) { display: flex; gap: 0.5rem; align-items: baseline; }
.gp-board li > input[type="checkbox"]:first-child { flex: none; margin: 0; accent-color: var(--gp-accent); }

.gp-board blockquote {
  margin: 0.75rem 0 0;
  padding: 0.625rem 0.75rem;
  border-radius: 8px;
  background: var(--gp-status-bg, var(--gp-surface));
  box-shadow: inset 0 0 0 1px var(--gp-status, var(--gp-border));
  font-size: 0.8125rem;
  line-height: 1.45;
  color: var(--gp-text);
}
.gp-board blockquote > :last-child { margin-bottom: 0; }

.gp-board .gp-diagram { margin: 0.25rem 0 0; }
.gp-board .gp-diagram figcaption {
  margin-top: 0.5rem;
  font-size: 0.75rem;
  color: var(--gp-text-muted);
}
.gp-board table { display: block; max-width: 100%; overflow-x: auto; font-size: 0.8125rem; }

/* No-script fallback */
.gp-board:not([data-gp-enhanced]) > h2 {
  margin: 1.75rem 0 0.75rem;
  padding-top: 1rem;
  border-top: 1px solid var(--gp-border);
}

@media (max-width: 30rem) { body { padding: 1rem; } }

@media print {
  :root, :root[data-theme] {
    --gp-bg: #fff; --gp-surface: #fff; --gp-surface-alt: #fff; --gp-surface-hover: #fff;
    --gp-text: #111; --gp-text-secondary: #333; --gp-text-muted: #555; --gp-text-faint: #777;
    --gp-accent: #111; --gp-accent-hover: #111; --gp-accent-soft: #fff; --gp-accent-border: #999;
    --gp-accent-tag: #eee; --gp-accent-text: #111;
    --gp-border: #ccc; --gp-border-subtle: #e2e2e2; --gp-border-strong: #999;
    --gp-code-text: #111; --gp-shadow: none; --gp-chart-bg: transparent;
  }
  body { background: #fff; padding: 0; }
  .gp-board-lanes { display: block; }
  .gp-board-lane { margin-bottom: 12pt; padding: 0; border-radius: 0; }
  .gp-board-lane.gp-status-blocked { box-shadow: none; }
  .gp-board-lane.is-wide { border: 0; padding: 0; }
  .gp-board-lane > ul { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gp-board li { break-inside: avoid; }
  .gp-board h2 { break-after: avoid; }
  .gp-board .gp-diagram { break-inside: avoid; }
}
</style>
<div class="gp-board">
{{content}}
</div>
<script>
/* Progressive enhancement: h2 groups become lanes; status is inferred from the
   heading's own words (the text stays the source of truth); "owner: X:" task
   prefixes become a meta line. DOM moves and text nodes only. */
(function () {
  var root = document.currentScript && document.currentScript.previousElementSibling;
  if (!root || !root.classList || !root.classList.contains('gp-board')) root = document.querySelector('.gp-board');
  if (!root || root.hasAttribute('data-gp-enhanced')) return;
  /* Explicit status (.gp-status-* or data-status on an authored section or its h2)
     always wins. Inference is a convenience in en / fi / sv / de; anything else
     stays a neutral lane with its heading text unchanged. */
  function words(list) { return new RegExp('(?:^|[^\\p{L}])(?:' + list + ')(?![\\p{L}])', 'iu'); }
  var RULES = [
    [words('blocked|waiting|stuck|on hold|at risk|estetty|estynyt|odottaa|jumissa|blockerad|väntar|blockiert|wartet'), 'blocked'],
    [words('done|completed?|shipped|finished|closed|valmis|valmiit|tehty|klar|klart|erledigt|fertig'), 'done'],
    [words('next|in progress|doing|active|now|current|seuraavat?|työn alla|kesken|käynnissä|nästa|pågår|pågående|in arbeit|als nächstes'), 'next'],
    [words('later|future|backlog|someday|planned|myöhemmin|tulevat|suunniteltu|senare|später|geplant'), 'future']
  ];
  var NAMES = { done: 'Done', next: 'Next', blocked: 'Blocked', future: 'Later' };
  var head = document.createElement('header');
  var lanes = document.createElement('div');
  var lane = null;
  head.className = 'gp-board-head';
  lanes.className = 'gp-board-lanes';
  [].slice.call(root.children).forEach(function (el) {
    if (el.tagName === 'SECTION' && el.querySelector(':scope > h2')) {
      el.classList.add('gp-board-lane');
      lanes.appendChild(el);
      lane = el;
      return;
    }
    if (el.tagName === 'H2') {
      lane = document.createElement('section');
      lane.className = 'gp-board-lane';
      lanes.appendChild(lane);
    }
    if (lane) lane.appendChild(el);
    else if (el.matches('h1, p, hr')) head.appendChild(el);
    // Other introductory content remains in source order, not inside the flex header.
  });
  var tally = document.createElement('ul');
  tally.className = 'gp-board-tally';
  tally.setAttribute('aria-label', 'Status summary');
  function parseCards(items) {
    [].forEach.call(items, function (li) {
      var t = li.firstElementChild;
      if (!t || t.tagName !== 'STRONG' || li.firstChild !== t) return;
      var rest = t.nextSibling;
      if (!rest || rest.nodeType !== 3) return;
      var text = rest.nodeValue.replace(/^\s*[:\u2013\u2014-]\s*/, '');
      var m = /^owner:\s*([^:]+?)\s*:\s*/i.exec(text);
      if (m) {
        text = text.slice(m[0].length);
        var meta = document.createElement('span');
        meta.className = 'gp-board-meta';
        var b = document.createElement('b');
        b.textContent = 'Owner';
        meta.appendChild(b);
        meta.appendChild(document.createTextNode(m[1]));
        li.appendChild(meta);
      }
      rest.nodeValue = text;
    });
  }
  parseCards(root.querySelectorAll(':scope > ul > li, :scope > ol > li'));
  [].forEach.call(lanes.children, function (s) {
    var h = s.querySelector(':scope > h2');
    if (h) {
      if (!h.id) {
        var id, n = 1;
        do { id = 'gp-board-heading-' + n++; } while (document.getElementById(id));
        h.id = id;
      }
      s.setAttribute('aria-labelledby', h.id);
    }
    if (s.querySelector('.gp-diagram, table, figure, pre')) s.classList.add('is-wide');
    var explicit = /gp-status-(done|next|blocked|future)/.exec(s.className + ' ' + (h ? h.className : ''));
    var status = explicit ? explicit[1] : (s.getAttribute('data-status') || (h && h.getAttribute('data-status')) || null);
    if (status && !NAMES[status]) status = null;
    if (!status && h) RULES.some(function (r) { if (r[0].test(h.textContent)) { status = r[1]; return true; } });
    var items = s.querySelectorAll(':scope > ul > li, :scope > ol > li');
    if (status) {
      s.dataset.status = status;
      s.classList.add('gp-status-' + status);
      var chip = document.createElement('li');
      chip.className = 'gp-status-' + status;
      chip.textContent = NAMES[status] + ': ' + items.length + ' ' + (h ? h.textContent.trim() : 'items');
      tally.appendChild(chip);
    }
    if (h && items.length) {
      var n = document.createElement('span');
      n.className = 'gp-board-count';
      n.textContent = items.length;
      var vh = document.createElement('span');
      vh.className = 'gp-vh';
      vh.textContent = items.length === 1 ? ' item' : ' items';
      n.appendChild(vh);
      h.appendChild(n);
    }
    parseCards(items);
  });
  if (head.children.length) root.insertBefore(head, root.firstChild);
  if (tally.children.length) root.appendChild(tally);
  if (lanes.children.length) root.appendChild(lanes);
  root.setAttribute('data-gp-enhanced', '');
})();
</script>
