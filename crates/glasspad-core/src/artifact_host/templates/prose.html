<style>
/* Glasspad built-in template: prose — long-form reading.
   Extends base.css .gp-prose; .gp-read scopes this template's refinements. */
.gp-read {
  padding-block: clamp(0.5rem, 4vw, 3rem) 4rem;
  font-kerning: normal;
  font-variant-numeric: oldstyle-nums proportional-nums;
}
.gp-read > p,
.gp-read li { text-wrap: pretty; }

.gp-read > h1 {
  font-size: clamp(2rem, 1.35rem + 2.6vw, 2.75rem);
  line-height: 1.12;
  letter-spacing: -0.021em;
  margin-bottom: 0.45em;
  text-wrap: balance;
}

/* Byline: optional class, or an italic-only paragraph detected by the enhancement. */
.gp-read > .gp-byline {
  font-family: var(--gp-font-sans);
  font-size: 0.8125rem;
  line-height: 1.5;
  letter-spacing: 0.01em;
  font-variant-numeric: lining-nums;
  color: var(--gp-text-muted);
  margin: 0 0 2rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--gp-border);
}
.gp-read > .gp-byline em { font-style: normal; }

/* Lead: the first body paragraph after the title/byline, or .gp-lead. */
.gp-read > h1 + p:not(.gp-byline),
.gp-read > h1 + p.gp-byline + p,
.gp-read > .gp-lead {
  font-size: 1.1667em;
  line-height: 1.6;
  margin-bottom: 1.5em;
}

.gp-read h2 {
  font-size: 1.5rem;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin: 2.4em 0 0.7em;
  padding-bottom: 0;
  border-bottom: 0;
  text-wrap: balance;
}
.gp-read h3 {
  font-size: 1.1875rem;
  font-style: italic;
  font-weight: 600;
  margin: 2em 0 0.5em;
}
.gp-read h4 {
  font-family: var(--gp-font-sans);
  font-size: 0.875rem;
  font-weight: 600;
  margin: 1.75em 0 0.4em;
}

.gp-read a {
  text-decoration-color: var(--gp-accent-border);
  text-underline-offset: 0.18em;
}
.gp-read a:hover { text-decoration-color: currentColor; }
.gp-read a:focus-visible {
  outline: 2px solid var(--gp-focus);
  outline-offset: 2px;
  border-radius: 2px;
  text-decoration-color: currentColor;
}

.gp-read blockquote {
  margin: 2em 0;
  padding: 0 0 0 1.25em;
  border-inline-start: 2px solid var(--gp-border-strong);
  font-size: 1.0833em;
  line-height: 1.6;
  color: var(--gp-text-secondary);
}

.gp-read li { padding-inline-start: 0.2em; }
.gp-read ol > li::marker {
  font-family: var(--gp-font-sans);
  font-size: 0.85em;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--gp-text-muted);
}

/* Tables: sans, lining tabular figures, hairline structure. Scroll locally (base). */
.gp-read table {
  width: auto;
  margin: 2em 0;
  font-family: var(--gp-font-sans);
  font-size: 0.875rem;
  line-height: 1.45;
  font-variant-numeric: lining-nums tabular-nums;
}
.gp-read th,
.gp-read td {
  padding: 0.6rem 1.25rem 0.6rem 0;
  border-bottom: 1px solid var(--gp-border);
  vertical-align: top;
}
.gp-read :is(th, td):last-child { padding-inline-end: 0; }
.gp-read th {
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--gp-text-secondary);
  border-bottom-color: var(--gp-border-strong);
  vertical-align: bottom;
}
.gp-read tbody tr:hover { background: none; }
.gp-read [align="right"] { text-align: right; }
.gp-read [align="center"] { text-align: center; }

.gp-read pre {
  margin: 1.75em 0;
  padding: 1rem 1.25rem;
  font-size: 0.8125rem;
  line-height: 1.65;
  tab-size: 2;
}
.gp-read :not(pre) > code { font-size: 0.8em; padding: 0.12em 0.35em; }

.gp-read img {
  border: 1px solid var(--gp-border);
  background: var(--gp-surface);
}
.gp-read > p > img:only-child,
.gp-read figure img { margin: 2em auto; }
.gp-read figure > img { margin-bottom: 0; }
.gp-read figcaption { font-family: var(--gp-font-sans); }

.gp-read hr {
  width: 25%;
  margin: 3em auto;
  border-top-color: var(--gp-border-strong);
}

/* Optional: callout (aside/div) — falls back to ordinary content. */
.gp-read > .gp-callout {
  margin: 1.75em 0;
  padding: 1rem 1.25rem;
  border: 1px solid var(--gp-border);
  border-radius: 8px;
  background: var(--gp-surface-alt);
  font-family: var(--gp-font-sans);
  font-size: 0.9375rem;
  line-height: 1.6;
}
.gp-read > .gp-callout > :first-child { margin-top: 0; }
.gp-read > .gp-callout > :last-child { margin-bottom: 0; }

/* Optional: wide figure breaks out of the measure when there is no TOC rail. */
.gp-read > .gp-figure-wide {
  width: min(60rem, calc(100vw - 3rem));
  max-width: none;
  margin-inline: calc((100% - min(60rem, calc(100vw - 3rem))) / 2);
}
.gp-doc .gp-read > .gp-figure-wide { width: auto; margin-inline: 0; }

/* TOC rail generated by Glasspad (.gp-doc > .gp-prose + .gp-toc). */
.gp-doc { gap: 3.5rem; max-width: calc(var(--gp-prose-measure) + 15rem + 3.5rem); }
.gp-doc > .gp-toc {
  top: 2rem;
  margin-top: clamp(0.5rem, 4vw, 3rem);
  padding-top: 0.625rem;
}
.gp-toc-list a {
  padding: 0.3em 0 0.3em calc(1rem - 1px);
  margin-inline-start: calc(-1rem - 1px);
  border-inline-start: 2px solid transparent;
  line-height: 1.4;
}
.gp-toc-list .gp-toc-l3 a { padding-inline-start: calc(2rem - 1px); }
.gp-toc-list a[aria-current] {
  color: var(--gp-text);
  border-inline-start-color: var(--gp-accent);
}
.gp-toc-list a:focus-visible {
  outline: 2px solid var(--gp-focus);
  outline-offset: -2px;
  border-radius: 2px;
}

@media (max-width: 30rem) {
  body { padding: 1rem; }
  .gp-read { font-size: 1.0625rem; padding-block: 0.5rem 3rem; }
  .gp-read h2 { font-size: 1.3125rem; }
}

/* Print: ink-light tokens, full width, no rail. */
@page { margin: 18mm 18mm 20mm; }
@media print {
  :root, :root[data-theme] {
    --gp-bg: #fff; --gp-surface: #fff; --gp-surface-alt: #f4f4f4; --gp-surface-hover: #fff;
    --gp-text: #111; --gp-text-secondary: #333; --gp-text-muted: #555; --gp-text-faint: #777;
    --gp-accent: #111; --gp-accent-hover: #111; --gp-accent-soft: #fff; --gp-accent-border: #999;
    --gp-accent-tag: #eee; --gp-accent-text: #111;
    --gp-border: #ccc; --gp-border-subtle: #e2e2e2; --gp-border-strong: #999;
    --gp-code-text: #111; --gp-shadow: none; --gp-chart-bg: transparent;
  }
  body { background: #fff; padding: 0; }
  .gp-read { padding: 0; font-size: 11pt; line-height: 1.55; }
  .gp-read > h1 { font-size: 22pt; }
  .gp-read h2 { font-size: 15pt; break-after: avoid; }
  .gp-read h3, .gp-read h4 { break-after: avoid; }
  .gp-read p, .gp-read li { orphans: 3; widows: 3; }
  .gp-read a[href^="http"]::after {
    content: " (" attr(href) ")";
    font-family: var(--gp-font-sans);
    font-size: 0.8em;
    color: #555;
    overflow-wrap: anywhere;
  }
  .gp-read table { display: table; width: 100%; font-size: 9pt; }
  .gp-read thead { display: table-header-group; }
  .gp-read pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  .gp-read img { max-height: 60vh; width: auto; break-inside: avoid; }
  .gp-read > .gp-figure-wide { width: auto; margin-inline: 0; }
}
</style>
<article class="gp-prose gp-read">
{{content}}
</article>
<script>
/* Optional: marks the TOC entry for the section being read (aria-current).
   Without script the rail is still a complete list of in-page links. */
(function () {
  function init() {
    /* CSS :only-child ignores text nodes. Check them so a sentence containing
       one emphasized phrase is not mistaken for an italic-only byline. */
    var title = document.querySelector('.gp-read > h1');
    var intro = title && title.nextElementSibling;
    if (intro && intro.tagName === 'P') {
      var meaningful = [].slice.call(intro.childNodes).filter(function (n) {
        return n.nodeType !== 3 || n.textContent.trim();
      });
      if (meaningful.length === 1 && meaningful[0].nodeType === 1 &&
          meaningful[0].tagName === 'EM') intro.classList.add('gp-byline');
    }
    var links = [].slice.call(document.querySelectorAll('.gp-toc-list a[href^="#"]'));
    if (!links.length) return;
    var pairs = [];
    links.forEach(function (a) {
      var el = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
      if (el) pairs.push([el, a]);
    });
    var current = null, queued = false;
    function update() {
      queued = false;
      var line = window.innerHeight * 0.3, best = pairs.length ? pairs[0][1] : null;
      pairs.forEach(function (p) { if (p[0].getBoundingClientRect().top <= line) best = p[1]; });
      if (best === current) return;
      if (current) current.removeAttribute('aria-current');
      if (best) best.setAttribute('aria-current', 'location');
      current = best;
    }
    window.addEventListener('scroll', function () {
      if (!queued) { queued = true; requestAnimationFrame(update); }
    }, { passive: true });
    update();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
